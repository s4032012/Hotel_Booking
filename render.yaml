databases:
  - name: hotel-booking-db
    plan: free
    region: singapore
    databaseName: hotel_booking
    user: hotel_booking_user
    postgresMajorVersion: "17"

services:
  - type: web
    name: hotel-booking-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz.php
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_MODE
        value: free
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: DB_CONNECTION
        value: pgsql
      - key: AUTO_SEED
        value: "true"
      - key: DISABLE_FILE_UPLOADS
        value: "true"
      - key: DEFAULT_ROOM_IMAGE
        value: hotel-bg.jpg
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-booking-db
          property: connectionString
